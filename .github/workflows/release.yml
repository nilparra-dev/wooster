name: Release

# Publishing a GitHub release for tag vX.Y.Z publishes that version to npm.
# npm authenticates this workflow through trusted publishing (OIDC), so no
# long-lived token is stored, and the package gets a provenance attestation
# that links it to this repository and commit.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install --global npm@11

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Smoke test packed artifact
        run: npm run test:package

      # Prereleases go to the beta dist-tag from publishConfig. A full release
      # drops that setting in the checkout so npm publishes it as latest;
      # removing it avoids depending on how npm ranks --tag against
      # publishConfig.
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" != "true" ]; then
            npm pkg delete publishConfig.tag
          fi
          npm publish --provenance
