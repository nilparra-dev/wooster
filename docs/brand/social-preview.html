<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wooster social preview</title>
    <!-- Source of social-preview.png, the 1280x640 image GitHub shows when the
         repository is shared. Render it with: node docs/brand/render-social-preview.mjs -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1280px; height: 640px; }
      body {
        display: flex; align-items: center; gap: 72px; padding: 0 120px;
        background: radial-gradient(circle at 18% 50%, #24262b 0, #101113 58%);
        color: #f4f5f7; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      svg { flex: none; width: 240px; height: 240px; filter: drop-shadow(0 24px 48px rgb(0 0 0 / 0.55)); }
      rect { stroke: #2c2f36; stroke-width: 1; }
      h1 { font-size: 104px; font-weight: 700; letter-spacing: -4px; line-height: 1; }
      p { margin-top: 20px; max-width: 700px; font-size: 32px; line-height: 1.35; color: #b4b9c3; }
      code {
        display: inline-block; margin-top: 36px; padding: 14px 22px; border-radius: 12px;
        background: #1c1e22; border: 1px solid #2c2f36; color: #f4f5f7;
        font: 26px Consolas, "SF Mono", Menlo, monospace;
      }
      code span { color: #6d7380; }
    </style>
